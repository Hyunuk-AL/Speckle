# Speckle Server 依存サービス (PostgreSQL / Valkey / MinIO)
#
# 起動:  docker compose -f docker-compose-deps.yml up -d
# 停止:  docker compose -f docker-compose-deps.yml down
# データごと削除: docker compose -f docker-compose-deps.yml down -v

name: speckle

services:
  postgres:
    image: 'postgres:16.4-alpine3.20'
    restart: always
    environment:
      POSTGRES_DB: speckle
      POSTGRES_USER: speckle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speckle}
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    ports:
      # ホストの psql / pgAdmin から覗くためにローカルのみ公開
      - '127.0.0.1:5432:5432'
    command: postgres -c max_prepared_transactions=150
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U speckle -d speckle']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - speckle

  redis:
    # Speckle は Redis 互換の Valkey を利用
    image: 'valkey/valkey:8.1-alpine'
    restart: always
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - speckle

  minio:
    image: 'minio/minio'
    command: server /data --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      # 9000: S3 API (プレビュー画像等の参照に必要), 9001: 管理コンソール
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - speckle

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  speckle:
    name: speckle
